<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e2640" stroke-width="4"/>

  <!-- Centered Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)"/>

  <!-- Outer Precision Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- Perfectly Aligned Symmetrical Core Hexagon / Nodes -->
  <polygon points="256,156 342,206 342,306 256,356 170,306 170,206" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.6"/>

  <!-- Center Core Ring -->
  <circle cx="256" cy="256" r="56" fill="#0c0e17" stroke="url(#ringGrad)" stroke-width="12"/>
  <circle cx="256" cy="256" r="24" fill="#38bdf8"/>

  <!-- Perfectly Balanced Axis Nodes -->
  <circle cx="256" cy="116" r="12" fill="#38bdf8"/>
  <circle cx="396" cy="256" r="12" fill="#38bdf8"/>
  <circle cx="256" cy="396" r="12" fill="#38bdf8"/>
  <circle cx="116" cy="256" r="12" fill="#38bdf8"/>
</svg>
