version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./omnirole.db
      - LLM_PROVIDER=mock
      - LLM_BASE_URL=https://api.openai.com/v1
      - LLM_MODEL=qwen-2.5-72b-instruct
      - SECRET_KEY=omnirole_docker_secret_key_998877
    volumes:
      - backend_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  backend_data:
